<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff" />
      <stop offset="100%" stop-color="#5500ff" />
    </linearGradient>
    <linearGradient id="grad-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Pink Diamond (Rotated Square) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Glow layer -->
    <rect x="116" y="116" width="280" height="280" fill="none" stroke="#ec4899" stroke-width="32" stroke-linejoin="miter" opacity="0.3" />
    <!-- Core line -->
    <rect x="116" y="116" width="280" height="280" fill="none" stroke="#ec4899" stroke-width="12" stroke-linejoin="miter" />
    <!-- Outer thin line -->
    <rect x="92" y="92" width="328" height="328" fill="none" stroke="#ec4899" stroke-width="3" opacity="0.6" />
    <!-- Inner thin line -->
    <rect x="140" y="140" width="232" height="232" fill="none" stroke="#ec4899" stroke-width="3" opacity="0.4" />
  </g>

  <!-- Cyan Square -->
  <g>
    <!-- Glow layer -->
    <rect x="126" y="126" width="260" height="260" fill="none" stroke="url(#grad-cyan)" stroke-width="32" stroke-linejoin="miter" opacity="0.3" />
    <!-- Core line -->
    <rect x="126" y="126" width="260" height="260" fill="none" stroke="url(#grad-cyan)" stroke-width="12" stroke-linejoin="miter" />
    <!-- Outer thin line -->
    <rect x="102" y="102" width="308" height="308" fill="none" stroke="url(#grad-cyan)" stroke-width="3" opacity="0.6" />
    <!-- Inner thin line -->
    <rect x="150" y="150" width="212" height="212" fill="none" stroke="url(#grad-cyan)" stroke-width="3" opacity="0.4" />
  </g>

  <!-- Center Metallic F Background -->
  <path d="M 210 120 H 350 L 325 190 H 245 L 235 230 H 305 L 280 300 H 215 L 175 400 H 115 L 210 120 Z" fill="url(#grad-metal)" stroke="#374151" stroke-width="6" stroke-linejoin="round" />


</svg>
